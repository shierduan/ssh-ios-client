name: SSHClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 固定到 1.16.0：1.19+ 引入了 SwiftTermBuildInfoPlugin 构建插件，
    # 在云端 Xcode 26 下插件校验失败导致编译不过；1.16.0 核心 TerminalView API 完备且可干净编译。
    exact: "1.16.0"

targets:
  SSHClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SwiftTerm
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "用于解锁保存的 SSH 私钥与连接凭据"
        UIBackgroundModes:
          - fetch
          - processing
        CFBundleDisplayName: "SSHClient"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SSHClient
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/SSHClient/BridgingHeader.h"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # NMSSH 为 Objective-C,放宽严格并发以避免与 Swift 6 编译冲突
        SWIFT_STRICT_CONCURRENCY: "minimal"
