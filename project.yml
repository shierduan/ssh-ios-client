name: SSHClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 最新发布为 v1.99.2（SPM 识别为 1.99.2），尚无 2.x
    from: "1.99.2"

targets:
  SSHClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SwiftTerm
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "用于解锁保存的 SSH 私钥与连接凭据"
        UIBackgroundModes:
          - fetch
          - processing
        CFBundleDisplayName: "SSHClient"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SSHClient
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/SSHClient/BridgingHeader.h"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # NMSSH 为 Objective-C,放宽严格并发以避免与 Swift 6 编译冲突
        SWIFT_STRICT_CONCURRENCY: "minimal"
